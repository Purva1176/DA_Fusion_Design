/* ============================================================
   NIQ Liquid Glass Morphism — visual enhancement layer only.
   No structural, flow, or navigation changes: selectors match
   existing classes/ids; only paint properties (background,
   border, shadow, blur, color, radius, filter, transition,
   transform-on-interaction) are touched.
   Brand tokens: navy #060A45, blue #2D6DF6, light #E0E8F8,
   neutrals #FAFAFA→#808080, status red/green/gold/info.
   ============================================================ */

:root{
  --glass-surface:rgba(255,255,255,.62);
  --glass-surface-strong:rgba(255,255,255,.78);
  --glass-border:rgba(255,255,255,.55);
  --glass-hairline:rgba(6,10,69,.08);
  --glass-navy-surface:rgba(6,10,69,.86);
  --glass-blue-tint:rgba(45,109,246,.10);
  --elevation-1:0 1px 2px rgba(6,10,69,.06),0 1px 1px rgba(6,10,69,.04);
  --elevation-2:0 8px 24px rgba(6,10,69,.10),0 2px 6px rgba(6,10,69,.06);
  --elevation-3:0 24px 48px rgba(6,10,69,.18);
}

/* ---------- Ambient backdrop behind the device frame ---------- */
body{
  background:
    radial-gradient(1100px 650px at 12% -8%, rgba(45,109,246,.16), transparent 60%),
    radial-gradient(900px 600px at 112% 18%, rgba(6,10,69,.14), transparent 55%),
    radial-gradient(800px 700px at 50% 120%, rgba(45,109,246,.10), transparent 60%),
    #e9ecf6 !important;
  background-attachment:fixed !important;
}

/* ---------- Device frame ---------- */
.phone{
  background:var(--glass-surface-strong) !important;
  backdrop-filter:blur(28px) saturate(170%) !important;
  -webkit-backdrop-filter:blur(28px) saturate(170%) !important;
  border:1px solid var(--glass-border) !important;
}
@media(min-width:500px){
  .phone{
    box-shadow:var(--elevation-3),0 0 0 1px rgba(255,255,255,.5) inset !important;
    border-radius:28px !important;
  }
}

/* ---------- Header / top bar ---------- */
header,.fusion-header{
  background:linear-gradient(120deg,rgba(255,255,255,.82),rgba(224,232,248,.68)) !important;
  backdrop-filter:blur(22px) saturate(180%) !important;
  -webkit-backdrop-filter:blur(22px) saturate(180%) !important;
  border-bottom:1px solid var(--glass-hairline) !important;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 18px rgba(6,10,69,.06) !important;
}
.fusion-brand-mark{
  box-shadow:0 3px 10px rgba(45,109,246,.35),0 0 0 1px rgba(255,255,255,.5) inset !important;
}
.head-action{
  border-radius:11px !important;
  transition:background .15s ease,transform .1s ease;
}
.head-action:active{transform:scale(.92);}
.head-back-outline,.head-action.head-back-outline{
  background:rgba(255,255,255,.72) !important;
  backdrop-filter:blur(10px) saturate(160%) !important;
  -webkit-backdrop-filter:blur(10px) saturate(160%) !important;
  box-shadow:var(--elevation-1),0 0 0 1px rgba(255,255,255,.5) inset !important;
}

/* ---------- Footer action bar ---------- */
.foot{
  background:linear-gradient(0deg,rgba(255,255,255,.9),rgba(255,255,255,.62)) !important;
  backdrop-filter:blur(22px) saturate(180%) !important;
  -webkit-backdrop-filter:blur(22px) saturate(180%) !important;
  border-top:1px solid var(--glass-hairline) !important;
  box-shadow:0 -6px 18px rgba(6,10,69,.05) !important;
}

/* ---------- Buttons ---------- */
.btn{
  background:linear-gradient(155deg,#3d7bff,#2D6DF6 55%,#1b52d6) !important;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 16px rgba(45,109,246,.30) !important;
  border-radius:10px !important;
  position:relative;overflow:hidden;
  transition:transform .08s ease,box-shadow .15s ease,filter .15s ease;
}
.btn::after{
  content:"";position:absolute;inset:0 0 auto 0;height:48%;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));
  pointer-events:none;
}
.btn:active:not(:disabled){transform:scale(.985);filter:brightness(.96);}
.btn.sec{
  background:rgba(224,232,248,.72) !important;
  backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);
  box-shadow:var(--elevation-1),0 0 0 1px rgba(45,109,246,.12) inset !important;
  color:var(--blue) !important;
}
.btn.sec::after{display:none}
.btn.out{
  background:rgba(255,255,255,.65) !important;
  backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);
  border:1.3px solid rgba(45,109,246,.45) !important;
  box-shadow:var(--elevation-1) !important;
}
.btn.out::after{display:none}
.btn.ghost{
  background:rgba(242,242,242,.68) !important;
  backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);
  box-shadow:var(--elevation-1) !important;
}
.btn.ghost::after{display:none}
.btn:disabled::after{display:none}

/* ---------- Cards, tap targets, icon tiles ---------- */
.card,.tap,.iconTile,.auth-card{
  background:var(--glass-surface) !important;
  backdrop-filter:blur(16px) saturate(170%) !important;
  -webkit-backdrop-filter:blur(16px) saturate(170%) !important;
  border:1px solid rgba(255,255,255,.6) !important;
  box-shadow:var(--elevation-1) !important;
  border-radius:12px !important;
  transition:box-shadow .15s ease,border-color .15s ease,transform .08s ease;
}
.card:active,.tap:active{transform:scale(.993);}
.tap.active{
  background:linear-gradient(135deg,rgba(45,109,246,.16),rgba(224,232,248,.55)) !important;
  border-color:rgba(45,109,246,.55) !important;
  box-shadow:var(--elevation-1),0 0 0 1px rgba(45,109,246,.25) !important;
}
.card:active{border-color:rgba(45,109,246,.4) !important;}

/* ---------- Pills / badges / connection chip ---------- */
.pill{
  background:rgba(242,242,242,.72) !important;
  backdrop-filter:blur(8px) saturate(160%);-webkit-backdrop-filter:blur(8px) saturate(160%);
  border:1px solid rgba(255,255,255,.55) !important;
}
.pill.red{background:rgba(242,222,226,.78) !important;}
.pill.green{background:rgba(217,237,223,.78) !important;}
.pill.blue{background:rgba(224,232,248,.78) !important;}
.pill.gold{background:rgba(255,244,217,.78) !important;}
.connection{
  background:rgba(217,237,223,.78) !important;
  backdrop-filter:blur(8px) saturate(160%);-webkit-backdrop-filter:blur(8px) saturate(160%);
  box-shadow:var(--elevation-1) !important;
}
.connection.off{background:rgba(255,244,217,.82) !important;}
.connection-indicator{box-shadow:0 0 0 3px rgba(0,138,40,.18) !important;}
.connection-indicator.disconnected{box-shadow:0 0 0 3px rgba(170,33,63,.16) !important;}

/* ---------- Form fields ---------- */
.field,.search,input.field,select.field,textarea.field,.context-field select{
  background:rgba(255,255,255,.75) !important;
  backdrop-filter:blur(8px) saturate(150%);-webkit-backdrop-filter:blur(8px) saturate(150%);
  border:1px solid rgba(6,10,69,.14) !important;
  box-shadow:0 1px 2px rgba(6,10,69,.05) inset !important;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.field:focus,.search:focus,select.field:focus{
  outline:none !important;
  border-color:var(--blue) !important;
  box-shadow:0 0 0 3px rgba(45,109,246,.18) !important;
}

/* ---------- Sheets / modals / drawer ---------- */
.modal{background:rgba(6,10,69,.42) !important;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.sheet{
  background:rgba(255,255,255,.88) !important;
  backdrop-filter:blur(26px) saturate(180%) !important;
  -webkit-backdrop-filter:blur(26px) saturate(180%) !important;
  border:1px solid rgba(255,255,255,.6) !important;
  border-bottom:0 !important;
  box-shadow:var(--elevation-3) !important;
  border-radius:20px 20px 0 0 !important;
}
.fusion-drawer{
  background:rgba(255,255,255,.88) !important;
  backdrop-filter:blur(26px) saturate(180%) !important;
  -webkit-backdrop-filter:blur(26px) saturate(180%) !important;
  box-shadow:var(--elevation-3) !important;
}
.fusion-drawer-backdrop{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.drawer-item{background:transparent !important;border-radius:10px;transition:background .15s ease;}
.drawer-item:active{background:rgba(45,109,246,.10) !important;}

/* ---------- Toast / sync banner ---------- */
#toast,.fusion-sync-banner{
  background:rgba(6,10,69,.86) !important;
  backdrop-filter:blur(16px) saturate(180%) !important;
  -webkit-backdrop-filter:blur(16px) saturate(180%) !important;
  color:#fff !important;
  border-radius:12px !important;
  box-shadow:var(--elevation-2) !important;
}
.fusion-sync-banner{
  background:rgba(255,255,255,.88) !important;
  color:var(--navy) !important;
}
.sync-banner-copy b{color:var(--navy) !important;}
.sync-retry{
  background:var(--blue) !important;color:#fff !important;border:0 !important;
  border-radius:8px !important;padding:7px 11px !important;font-weight:700;
}

/* ---------- Notices / alerts ---------- */
.notice{
  background:rgba(255,244,217,.72) !important;
  backdrop-filter:blur(8px) saturate(160%);-webkit-backdrop-filter:blur(8px) saturate(160%);

/* ---------- Camera / capture chrome ---------- */
.cameraBar{
  background:rgba(17,20,42,.72) !important;

function btn(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}function badge(t,c=''){return `<span class="pill ${c}">${t}</span>`}function photo(cls='medium',over=false){return `<div class="imagebox ${cls} ${over?'overlaid':''}" onclick="if(!${over})openImage(false)"><img class="shelf" src="${SHELF}" alt="Captured refrigerated beverage shelf">${over?boxes():''}</div>`}function boxes(){const positions=PRODUCT_BOXES;const exceptionMap={4:1,17:2,47:3};return positions.map(([x,y,w,h],i)=>{const id=S.module===0?exceptionMap[i]:undefined;const ex=S.exceptions.find(e=>e.id===id);const state=ex?(ex.status==='resolved'?'blue':'red'):'';return `<div class="bbox ${state}" role="${ex&&ex.status!=='resolved'?'button':'img'}" title="${ex?esc(ex.name):'Recognized product'}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%" onclick="event.preventDefault();event.stopPropagation();${ex&&ex.status!=='resolved'?`selectException(${id})`:'void(0)'}"></div>`}).join('')}
function openImage(over){S.overlay=over;S.imageBack=S.page;go('imagefull')}function selectException(id){const ex=S.exceptions.find(x=>x.id===id);if(!ex||ex.status==='resolved')return;S.selected=id;S.module=0;S.exceptionOrigin='imagefull';if(ex.type==='fact'){go('fact')}else if(ex.confidence==='Medium'){go('candidate')}else{go('barcode')}}

function footer(html){return `<div class="foot">${html}</div>`}function pickerRow(label,value,type){return `<label class="context-field"><span>${label}</span><button type="button" class="instance-select" onclick="openPicker('${type}')"><span>${esc(value)}</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></label>`}function card(title,body,click=''){return `<div class="card" ${click?`onclick="${click}" style="cursor:pointer"`:''}><div class="row spread"><strong style="font-size:13px">${title}</strong></div>${body}</div>`}function stages(){return ['Image captured','Cloud upload','Product recognition','Result available'].map((t,i)=>`<div class="stage"><span class="dot ${i<S.step?'done':i===S.step?'now':''}"></span><span class="grow">${t}</span>${i<S.step?'<span class="check">✓</span>':i===S.step?badge('In progress','blue'):''}</div>`).join('')}

function saveExceptionFacts(){S.productFacts=Object.fromEntries([...document.querySelectorAll('[data-fact]')].map(e=>[e.dataset.fact,e.value]));S.factValue=S.productFacts.Price;resolveCurrent()}

function selectFactMode(x){S.factMode=x;S.moduleFilter='All';render()}
function showLegal(x){toast(x+' document requires an approved document URL')}
function toggleHelp(id){const el=$(id);if(el)el.hidden=!el.hidden}
function updateAgreeButton(){const b=document.querySelector('.foot .btn');if(b)b.disabled=!$('agree')?.checked}
function finishActivation(){S.activationStep=0;S.page='todo';S.history=[];render()}
function advanceActivation(){let st=S.activationStep||0;let v=id=>document.getElementById(id)?.value||'';if(st===0){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('actEmail')))return toast('Enter a valid work email');S.actEmail=v('actEmail');toast('Demo: code delivery requires backend integration')}if(st===1&&!/^\d{6}$/.test(v('actCode')))return toast('Enter a 6-digit code');if(st===2){if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(v('pw1'))||v('pw1')!==v('pw2'))return toast('Passwords must match and contain 8+ characters');if(!/^\d{4}$/.test(v('pin1'))||v('pin1')!==v('pin2'))return toast('Both 4-digit PINs must match')}if(st===3&&!document.getElementById('agree')?.checked)return toast('Review and accept the terms');if(st===4){S.activationComplete=true;render();return}S.activationStep=st+1;render()}
function render(){$('app').classList.toggle('dark',!!S.darkMode);let v=view();$('app').innerHTML=header()+`<div class="content">${v.main}</div>`+(v.foot?footer(v.foot):'')+pickerSheet()+(S.activationComplete?`<div class="modal"><div class="sheet ready-sheet"><div class="ready-symbol">✓</div><div class="h">You're all set!</div><p class="small">Your account is ready and device setup is complete.</p><button class="btn full" onclick="S.activationComplete=false;finishActivation()">Start store visits</button></div></div>`:'')+(S.showAssign?`<div class="modal"><div class="sheet"><div class="h">Self-assign template store</div><p class="small">Enter the store identity and visit period to create a new store instance.</p><label class="label">Store identity</label><input id="assignStoreId" class="field" placeholder="e.g. ST-1046"><label class="label" style="display:block;margin-top:10px">Visit period</label><input id="assignPeriod" class="field" placeholder="e.g. Oct 2026"><div class="row" style="margin-top:16px">${btn('Cancel',"closeAssign()",'ghost grow')}${btn('Create',"createAssign()",'grow')}</div></div></div>`:'')+(S.toast&&!['modules','preview','todo','store','fact'].includes(S.page)?`<div id="toast" style="position:absolute;bottom:85px;left:20px;right:20px;background:#060A45;color:white;padding:12px;border-radius:5px;text-align:center;z-index:20;font-size:12px">${esc(S.toast)}</div>`:'');if(S.page==='imagefull')initImageZoom()}
let zoomPointers=new Map(),zoomScale=1,zoomStart=0;function initImageZoom(){const v=document.getElementById('zoomViewport'),stage=document.getElementById('zoomStage');if(!v||!stage)return;zoomScale=1;zoomPointers.clear();const update=()=>stage.style.transform=`scale(${zoomScale})`;v.addEventListener('pointerdown',e=>{zoomPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(zoomPointers.size===2){let a=[...zoomPointers.values()];zoomStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);v.dataset.base=zoomScale}});v.addEventListener('pointermove',e=>{if(!zoomPointers.has(e.pointerId))return;zoomPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(zoomPointers.size===2){let a=[...zoomPointers.values()];zoomScale=Math.min(5,Math.max(1,Number(v.dataset.base||1)*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(1,zoomStart)));update()}});for(let ev of ['pointerup','pointercancel'])v.addEventListener(ev,e=>zoomPointers.delete(e.pointerId));v.addEventListener('dblclick',()=>{zoomScale=zoomScale>1?1:2;update()});v.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoomScale=Math.min(5,Math.max(1,zoomScale*(e.deltaY>0?.9:1.1)));update()}},{passive:false})}
function toggleOnline(){S.online=!S.online;toast(S.online?'Back online · queued work can sync':'Offline mode · captures saved locally')};function syncNow(){if(S.online){S.sync='Synced';S.lastSync=new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});render();showSyncBanner('success','Data synced successfully','Last synced: '+S.lastSync)}else{S.sync='Pending';render();showSyncBanner('error','Sync unavailable','You are offline. Reconnect and retry.')}}
function showSyncBanner(kind,title,detail){document.getElementById('fusion-sync-banner')?.remove();let el=document.createElement('div');el.id='fusion-sync-banner';el.className='fusion-sync-banner '+kind;el.setAttribute('role',kind==='error'?'alert':'status');el.innerHTML='<div class="sync-banner-icon">'+fusionIcon(kind==='error'?'info':'check',20)+'</div><div class="sync-banner-copy"><b>'+title+'</b><span>'+detail+'</span></div>'+(kind==='error'?'<button class="sync-retry" onclick="syncNow()">Retry Sync</button>':'');document.getElementById('app').appendChild(el);if(kind==='success')setTimeout(()=>{if(el.isConnected)el.remove()},3000)}
function assignStore(){S.assignStep=0;S.assignStudy=null;S.assignSms='';S.assignError=false;S.assignResolved=null;go('assign')};function selectAssignStudy(i){S.assignStudy=i;render()};function assignGoStep(n){S.assignStep=n;S.assignError=false;render()};function assignGoNextFromStudy(){if(S.assignStudy==null)return;S.assignStep=1;render()};function assignDigit(d){if(S.assignError)S.assignError=false;let v=S.assignSms||'';if(v.length>=8)return;S.assignSms=v+d;render()};function assignBackspace(){S.assignSms=(S.assignSms||'').slice(0,-1);render()};function validateAssignSms(){let id=S.assignSms||'';if(id.length<6)return;if(id==='9999999'){S.assignError=true;render();return}S.assignResolved={name:'Central Market North',address:'12 Example Avenue',smsId:id};S.assignStep=2;render()};function confirmAssignStore(){let r=S.assignResolved;if(!r)return;S.todoExtra=S.todoExtra||[];let dup=S.todoExtra.some(e=>e.smsId===r.smsId)||r.smsId==='1023456';if(dup){toast('A self-assignment for this store and period already exists · open it instead');return}S.todoExtra.push({name:r.name,status:'Not Started',due:'19–25 Oct 2026',address:r.address,id:'SMS-'+r.smsId,smsId:r.smsId});S.assignStep=3;render()};function openAssignedStore(){S.history=[];S.page='store';render()};function backToTodoFromAssign(){S.history=[];S.page='todo';render()};function readInstructions(){if(!('speechSynthesis' in window)){toast('Audio playback unavailable');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('Audit instructions. Collect store profiling, inventory, purchases or sales, and store closure. Resolve all mandatory exceptions before export.');u.rate=.95;speechSynthesis.speak(u)}function stopInstructions(){if('speechSynthesis' in window)speechSynthesis.cancel()}

''}${rows}</div></div></div>`};function closeAssign(){S.showAssign=false;render()};function createAssign(){let sid=$('assignStoreId')?.value.trim()||'';let per=$('assignPeriod')?.value.trim()||'';if(!sid||!per){toast('Enter store identity and visit period');return}if(sid.toUpperCase()==='ST-1042'){toast('A self-assignment for this store and period already exists · open it instead');return}S.todoExtra=S.todoExtra||[];S.todoExtra.push({name:'Self-assigned store '+sid.toUpperCase(),status:'Not Started',due:per,id:sid.toUpperCase()});S.showAssign=false;toast('Store added to your To-Do List');render()};function closePendingModule(i){if(S.modules[i]?.status!=='pending'||S.modules[i]?.image)return;S.modules.splice(i,1);S.modules.forEach((m,j)=>m.name='Modular '+String(j+1).padStart(2,'0'));render()};function addModule(){S.pendingNewModule=true;S.stitch=false;S.shots=[];S.warning=!S.warningSeen;go(S.modules.some(m=>m.image)?'next':'capture')};function chooseMode(x){S.mode=x;go(x==='Image'?'modules':x==='Hybrid'?'hybrid':'activity')};function startCapture(i){S.module=i;S.stitch=false;S.shots=[];S.warning=!S.warningSeen;go('capture')};function startStitch(){S.stitch=true;S.shots=[];go('stitch')};function capture(){if(S.warning){S.warning=false;S.warningSeen=true;toast('Blur detected · hold steady and capture again');render();return}if(S.pendingNewModule){S.modules.push({name:'Modular '+String(S.modules.length+1).padStart(2,'0'),status:'pending',image:false});S.module=S.modules.length-1;S.pendingNewModule=false}S.stitch=false;go('preview');uploadInBackground(S.module)};function takeStitch(){if(S.shots.length<3)S.shots.push(S.shots.length+1);render()};function retakeFrame(){if(S.shots.length)S.shots.pop();toast('Last source frame cleared · earlier frames preserved')};function restartAllFrames(){if(!confirm('Restart this modular\'s stitching? All captured frames will be discarded.'))return;S.shots=[];toast('All frames cleared · capture frame 1 again');render()};function finishStitch(){if(S.shots.length<2){toast('Capture at least two overlapping frames');return}if(S.pendingNewModule){S.modules.push({name:'Modular '+String(S.modules.length+1).padStart(2,'0'),status:'pending',image:false});S.module=S.modules.length-1;S.pendingNewModule=false}S.stitch=true;go('preview');uploadInBackground(S.module)};function cancelCapture(){if(S.shots.length&&!confirm('Discard current stitching frames? Previously completed modulars are safe.'))return;S.shots=[];S.pendingNewModule=false;go('modules')};function uploadInBackground(index){S.modules[index].image=true;S.modules[index].status='waiting';S.modules[index].progress=0;if(!S.online){toast('Image queued securely · waiting for connection');return}let seq=[1,2,3,4];seq.forEach((n,i)=>setTimeout(()=>{S.modules[index].progress=n;if(n===4){S.modules[index].status=index===0&&S.exceptions.some(e=>e.status==='open')?'exceptions':'success';S.uploaded=true}if(S.page==='modules'||S.page==='preview')render()},700*(i+1)))};function upload(){uploadInBackground(S.module);go('modules')};function confirmProduct(){let x=S.exceptions.find(x=>x.id===S.selected);if(x.fact){go('fact')}else resolveCurrent()};function confirmBarcode(){let v=$('barcodeInput')?.value||'';S.barcode=v;let last=+v[v.length-1]||0;S.ogrds=last%2===1?'new':last%4===0?'sufficient':'insufficient';if(S.ogrds==='sufficient'){resolveCurrent();toast('Sufficient IR reference images already on file · no extra capture needed')}else if(S.ogrds==='new'){S.niStep=0;go('newitem')}else{go('reference')}};function startNewItemCapture(){S.niStep=1;render()};function captureNewItemPhoto(){S.niStep=2;render()};function retakeNewItemPhoto(){S.niStep=1;render()};function submitNewItemImage(){S.niStep=3;render()};function completeProduct(){let x=S.exceptions.find(x=>x.id===S.selected);if(x.fact)go('fact');else resolveCurrent()};function resolveCurrent(){let x=S.exceptions.find(x=>x.id===S.selected);let fv=$('factInput');if(fv)S.factValue=fv.value;x.status='resolved';S.modules[0].status=S.exceptions.every(x=>x.status==='resolved')?'success':'exceptions';S.modules[0].progress=4;if(S.exceptions.every(e=>e.status==='resolved')){S.history=[];go('modules');toast('All exceptions resolved · module completed')}else{openImage(true);toast('Exception resolved · marker on the shelf image turned blue')}};function showHybrid(){toast('Product selected · enter a configured hybrid fact')};function saveHybrid(){S.hybridFacts++;go('modules');toast('Hybrid fact saved · source Manual')};function closeStore(){S.export='queued';go('export')};function startExport(){if(!S.online){S.export='failed';toast('Offline · export pending, retry when connected');return}S.export='uploading';render();setTimeout(()=>{S.export='processing';render()},900);setTimeout(()=>{S.export='completed';S.receipt='FUS-2026-1042';go('receipt')},2100)};render();
